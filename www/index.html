let state='splash',scr='main',dk='w0',df=DIFF.w0,plats=[],cr=[],cn=[],pu=[],rv=[],genX=0,genY=0,nid=0,dist=0,coins=0,t=0,speed=0,bgx=0,tm=0,deaths=0,overAt=0,newBest=false,why='',earn=0,fin=false,finAt=0,place=0,finCount=0,bonus=0,splT=0,pw={s:0,m:0,b:0,g:0,x:0},inv=0,conf=false,musOn=0,toast='',toastU=0,held=false,contT=0,usedC=0,fx=[],bp=0,stars=0,doubled=false,endGen=false,keyAt=-1,keyDone=false,kys=[],ts=1,tutS=0,tutT=0,tutPl=[],tutPu=null,hiT=0,prevBest=0,stab=0,curW=0,curS=0,selW=0,bgW=0,dr=[],mu=[],lg=[],slideTut=false,slideT0=0,swy=null,btns=[],PAL=SK[0];

function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();mst=AC.createDynamicsCompressor();mst.connect(AC.destination)}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}

function remind(){

      LN.schedule({notifications:[
        {id:1,title:'Bandit Dash',body:'The rooftops are calling. Beat your best run!',schedule:{on:{hour:12,minute:30},allowWhileIdle:true},smallIcon:'ic_stat_bandit'},
        {id:2,title:'Bandit Dash',body:'The rivals are racing without you. Come back and win!',schedule:{on:{hour:19,minute:30},allowWhileIdle:true},smallIcon:'ic_stat_bandit'}]}).catch(()=>{});

}
function note(f,d,ty,v,at,f2,lf){
  const a=ac();if(!a)return;
  const n=a.currentTime+(at||0),o=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter();
  lp.type='lowpass';lp.frequency.value=lf||2400;o.type=ty||'sine';
  o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v||.2,n+.012);g.gain.exponentialRampToValueAtTime(.0001,n+d);
  o.connect(lp);lp.connect(g);g.connect(mst);o.start(n);o.stop(n+d+.03);
}
function nz(d,v,hp,at){
  const a=ac();if(!a)return;
  if(!nb){nb=a.createBuffer(1,a.sampleRate*.3,a.sampleRate);const x=nb.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1}
  const n=a.currentTime+(at||0),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=nb;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);
  s.connect(f);f.connect(g);g.connect(mst);s.start(n);s.stop(n+d);
}
function sfx(k){
  if(!S.sfx)return;
  if(k==='click')note(660,.08,'sine',.2,0,500);
  else if(k==='jump')note(330,.16,'triangle',.22,0,580);
  else if(k==='jump2')note(440,.16,'triangle',.22,0,760);
  else if(k==='coin'){note(988,.1,'sine',.18);note(1319,.18,'sine',.18,.07)}
  else if(k==='pow')[523,659,784,1047].forEach((f,i)=>note(f,.22,'triangle',.18,i*.07));
  else if(k==='crash'){note(150,.45,'sawtooth',.22,0,45,900);nz(.25,.25,300)}
  else if(k==='win')[523,659,784,1047,1319].forEach((f,i)=>note(f,.4,'triangle',.18,i*.1));
  else if(k==='no')note(220,.18,'triangle',.18,0,150);
  else if(k==='boing'){note(200,.28,'sine',.3,0,620);note(400,.2,'triangle',.12,.05,900)}
  else if(k==='slide')nz(.2,.14,1500);
  else if(k==='hi')[392,523,659,784,1047,1319].forEach((f,i)=>note(f,.5,'triangle',.18,i*.09));
}

const RT=[110,87.3,130.8,98],AR=[[220,262,330,262],[175,220,262,220],[262,330,392,330],[196,247,294,247]];
const MU=[{RT:RT,AR:AR},{RT:[73.4,58.3,87.3,65.4],AR:[[147,175,220,175],[117,147,175,147],[175,220,262,220],[131,165,196,165]]},{RT:[65.4,55,87.3,98],AR:[[262,330,392,330],[220,262,330,262],[349,440,523,440],[392,494,587,494]]}];
function music(m){
  clearInterval(mt);mt=null;song=m;if(!m)return;ms=0;

    if(!S.mus||!AC||AC.state!=='running')return;
    const c=(ms>>3)&3,i=ms&7,mo=MU[Math.min(2,song===2?curW:selW)],RT=mo.RT,AR=mo.AR,jw=(song===2?curW:selW)===2;
    if(song===1){

      if(i===0){note(RT[c],2,'sine',.2);note(RT[c]*2,2,'sine',.06)}
    }else if(jw){
      if(i===0||i===4)note(130,.14,'sine',.38,0,50);
      if(i===2||i===3||i===6)note(i===3?260:200,.07,'triangle',.28,0,150);
      if(i===5||i===7)note(300,.06,'triangle',.2,0,220);
      if(i===0||i===3||i===4||i===7)note(RT[c],.24,'triangle',.28,0,0,700);
      note(AR[c][ms&3]*2,.16,'sine',.14);note(AR[c][(ms+2)&3]*4,.1,'sine',.05);
    }else{
      if(i===0||i===4)note(150,.16,'sine',.45,0,42);
      if(i===2||i===6)nz(.12,.18,1500);
      if(i&1)nz(.04,.1,7000);
      if(i===0||i===3||i===4||i===7)note(RT[c],.22,'triangle',.3,0,0,700);
      note(AR[c][ms&3]*2,.18,'square',.07,0,0,3000);
    }
    ms++;
  },song===1?300:210);
}

// ---------- world ----------
const MS=[{id:'login',t:'Daily login',n:1,k:'login',c:60},{id:'race',t:'Play 3 races',n:3,k:'races',c:80},{id:'coin',t:'Collect 60 coins',n:60,k:'coins',key:1},{id:'pu',t:'Grab 5 power-ups',n:5,k:'pu',c:100},{id:'win',t:'Win a race',n:1,k:'wins',key:1}];
function dayCheck(){const d=new Date().toDateString();if(S.dm.d!==d){S.dm={d,login:1,races:0,coins:0,wins:0,pu:0};S.dc={};save()}}
function canClaim(){dayCheck();return !S.gift||MS.some(m=>(S.dm[m.k]||0)>=m.n&&!S.dc[m.id])}
function afterSplash(){dayCheck();menuScene();if(!S.terms)state='terms';else remind()}
function menuScene(){plats=[{x:-60,w:W+200,y:300,id:1}];cr=[];cn=[];pu=[];rv=[];dr=[];mu=[];lg=[];fin=false;pw.s=pw.m=pw.b=pw.g=pw.x=0;P.y=300;P.vy=0;P.air=false;P.so=0;state='menu';scr='main';conf=false}
function reset(){
  {const wd=WORLDS[curW];dk='w'+curW+'s'+curS;df={n:wd.n,sp:wd.sp[curS],rf:wd.rf[curS],m:1.5+curW*.25,L:wd.L[curS],g:[.26,.38],cr:.3}}
  const w0=Math.round(W*.8);plats=[{x:-60,w:w0,y:260,id:nid++}];cr=[];cn=[];pu=[];
  genX=w0-60;genY=260;P.y=260;P.vy=0;P.jumps=0;P.air=false;P.so=0;dist=0;coins=0;t=0;speed=df.sp;
  newBest=false;fin=false;finCount=0;place=0;bonus=0;pw.s=pw.m=pw.b=pw.g=pw.x=0;inv=0;usedC=0;bp=0;stars=0;
  const o=SK.map((_,i)=>i).filter(i=>i!==S.skin).sort(()=>Math.random()-.5);
  rv=[{d:12,seed:1,sl:0,fin:false,pal:SK[o[0]]},{d:24,seed:2,sl:0,fin:false,pal:SK[o[1]]}];
  endGen=false;kys=[];dr=[];mu=[];lg=[];slideTut=false;P.sl=0;keyAt=Math.random()<.2?rnd(.25,.8)*df.L:-1;keyDone=false;ts=1;tutS=0;tutT=0;if(S.tut===3)S.tut=4;if(S.tut===4)tutCourse();
  state='play';
}
function gen(){
  while(!endGen&&genX<W+300){
    const gap=speed*rnd(df.g[0],df.g[1]),d=[0,0,-40,-55,45,70];
    let ny=genY+d[Math.random()*d.length|0];ny=Math.max(200,Math.min(300,ny));
    let w=rnd(180,380)+(curW===2?60:0),last=false;const x=genX+gap,fxs=P.x+(df.L-dist)*10;
    if(x+w>fxs-60){last=true;w=Math.max(w,fxs+W+300-x)}
    if(curW>=1&&!last&&gap>110&&Math.random()<.35)plats.push({x:genX+gap/2-40,w:80,y:Math.round((genY+ny)/2),cb:true,id:nid++});
    plats.push({x,w,y:ny,id:nid++});
    for(let i=0;i<3;i++)cn.push({x:genX+gap*(i+1)/4,y:Math.min(genY,ny)-68-(i===1?22:0)});
    if(!last&&w>290&&Math.random()<df.cr)cr.push({x:x+rnd(140,w-120),y:ny-28,w:28,h:28});
    if(!last&&Math.random()<.2)pu.push({x:x+rnd(50,w-50),y:ny-62,k:'smbgx'[Math.random()*5|0]});
    if(!last&&w>230&&Math.random()<(df.dr||0)){const dxp=x+rnd(100,w-90);if(!cr.some(c=>Math.abs(c.x-dxp)<150))dr.push({x:dxp,y:ny-46,w:34,h:20,ph:Math.random()*6})}
    if(curW===2&&!last&&w>270&&Math.random()<.28){const mx=x+rnd(130,w-120);if(!cr.some(c=>Math.abs(c.x-mx)<140)&&!dr.some(d=>Math.abs(d.x-mx)<140)&&!lg.some(l=>Math.abs(l.x-mx)<200)){mu.push({x:mx,y:ny,w:34,h:18,t:-9});for(let i=0;i<5;i++)cn.push({x:mx+17+(i-2)*24,y:ny-112+Math.abs(i-2)*12})}}
    if(curW===2&&!last&&w>300&&Math.random()<.2+.05*curS){const lx=x+rnd(150,w-150);if(!cr.some(c=>Math.abs(c.x-lx)<220)&&!dr.some(d=>Math.abs(d.x-lx)<220)&&!mu.some(m=>Math.abs(m.x-lx)<220))lg.push({x:lx,L:ny-20,ph:Math.random()*6,om:1.5+.12*curS+Math.random()*.2,amp:.5,y:ny})}
    if(keyAt>=0&&!keyDone&&!last&&dist+(x+w/2-P.x)/10>=keyAt){kys.push({x:x+w/2,y:ny-70});keyDone=true}
    genX=x+w;genY=ny;if(last){endGen=true;genX=1e9}
  }
}
function slide(){if(P.air)P.vy=Math.max(P.vy,900);P.sl=.7;sfx('slide');vib(12);if(slideTut){slideTut=false;ts=1;S.sl1=1;save()}}
function jump(){if(P.jumps<2){P.sl=0;P.vy=(P.jumps===0?-640:Math.min(-560,P.vy-120))*(pw.b>0?1.22:1);P.jumps++;P.air=true;sfx(P.jumps===1?'jump':'jump2');if(S.tut===4){if(tutS===1){tutS=2;ts=1}else if(tutS===3){tutS=4;tutT=0;ts=.25}else if(tutS===4){tutS=5;ts=1}}}}
function die(r,ok){
  ts=1;
  if(!ok&&!fin){state='cont';contT=6;why=r;overAt=performance.now();sfx('crash');vib(120);return}
  finish(r,ok);
}
function revive(){
  usedC++;const px=P.x+P.w/2;let p=plats.find(q=>q.x<=px&&q.x+q.w>=px);
  if(!p)p=plats.find(q=>q.x>px)||plats[plats.length-1];
  if(p.x>px){const sh=p.x-(px-20);plats.forEach(q=>q.x-=sh);cr.forEach(c=>c.x-=sh);cn.forEach(c=>c.x-=sh);pu.forEach(u=>u.x-=sh);kys.forEach(k=>k.x-=sh);dr.forEach(d=>d.x-=sh);mu.forEach(m=>m.x-=sh);lg.forEach(l=>l.x-=sh);genX-=sh;bgx+=sh}
  cr=cr.filter(c=>c.x<P.x-40||c.x>P.x+260);dr=dr.filter(d=>d.x<P.x-40||d.x>P.x+260);lg=lg.filter(l=>Math.abs(l.x-P.x)>260);
  P.y=p.y;P.vy=0;P.air=false;P.jumps=0;P.so=0;pw.s=Math.max(pw.s,5);inv=1.5;ts=1;state='play';
}
function finish(r,ok){
  state='over';why=r;overAt=performance.now();deaths++;
  if(ok){sfx('win');vib([40,50,40,50,80])}S.runs++;dayCheck();S.dm.races++;if(ok&&place===1)S.dm.wins++;
  const s=score();prevBest=S.best[dk]||0;newBest=s>prevBest;selW=curW;if(newBest)S.best[dk]=s;hiT=0;if(newBest&&s>0){state='hi';sfx('hi')}
  earn=Math.floor(coins/2)+(ok?[20,10,4][place-1]:0);S.coins+=earn;
  if(ok){stars=Math.max(1,4-place-usedC);S.stars[dk]=Math.max(S.stars[dk]||0,stars)}if(ok&&place===1)S.keys++;doubled=false;
  save();Ads.onGameOver(deaths);
}
function update(dt){
  t+=dt;{const z=Math.min(1,dist/df.L);df.g=[.26+.2*z+.02*curS+.02*curW,Math.min(.58,.38+.17*z+.02*curS+.02*curW)];df.cr=Math.min(.85,(.26+.4*z+.07*curS+.05*curW)*(curW===0&&curS===0?.8:1));df.dr=z<.15?0:Math.min(.42,.1+.25*z+.04*curS+.03*curW)}speed=df.sp+Math.min(190,t*3.5);const dx=speed*dt*(fin?Math.max(0,1-(performance.now()-finAt)/600):1);dist+=dx/10;bgx+=dx;genX-=dx;if(pw.x>0)bp+=dx/10*df.m;
  if(P.sl>0){P.sl-=dt;if(!P.air&&Math.random()<.5)fx.push({k:0,x:P.x+14,y:P.y-1,vx:-110,vy:-25,l:.3,t:.3})}
  for(const k of 'smbgx')if(pw[k]>0)pw[k]-=dt;if(inv>0)inv-=dt;
  if(S.tut!==4&&!S.sl1&&(S.slh||0)<2&&!slideTut){const d0=dr.find(d=>d.x>P.x&&d.x-P.x<240);if(d0){slideTut=true;ts=.15;slideT0=performance.now();S.slh=(S.slh||0)+1}}
  if(slideTut&&performance.now()-slideT0>3200){slideTut=false;ts=1}
  rv.forEach(r=>{
    if(r.fin)return;
    if(r.sl<=0&&Math.random()<dt*.12)r.sl=.9;
    if(r.sl>0)r.sl-=dt;
    const g=r.d-dist,f=df.rf+.05*Math.sin(t*.7+r.seed*3)+(g>40?-.05:g<-40?.05:0)-(r.sl>0?.5:0);
    r.d+=speed*f*dt/10;
    if(r.d>=df.L){r.d=df.L;r.fin=true;finCount++}
  });
  if(!fin&&dist>=df.L){fin=true;finAt=performance.now();place=finCount+1;sfx('win')}

  drawBg();plats.forEach(drawPlat);if(pw.s>0&&(state==='play'||state==='cont'))drawBridges();mu.forEach(drawMush);cr.forEach(drawCrate);dr.forEach(drawDrone);lg.forEach(drawLog);cn.forEach(drawCoin);pu.forEach(drawPu);kys.forEach(drawKeyPu);rv.forEach(drawRival);drawFinish();
  {const sg=rivalPos(P.x+11);if(sg&&!sg.air){ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(P.x+11,sg.y+2,Math.max(6,14-(sg.y-P.y)*.05),4,0,0,7);ctx.fill()}}
  if(pw.g>0&&P.air&&(state==='play'||state==='cont'))drawMat();
  {const o=P.so||0;P.y+=o;ctx.globalAlpha=inv>0&&Math.floor(tm*20)%2?.4:1;BOOT=pw.b>0?BT[S.boot]:null;drawPlayer();BOOT=null;ctx.globalAlpha=1;P.y-=o}
  if(pw.s>0&&state!=='menu'){ctx.strokeStyle='rgba(57,229,255,'+(.5+.3*Math.sin(tm*8))+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(P.x+11,P.y-24,30,0,7);ctx.stroke()}
  drawRain();if(bgW===2)drawVines();drawFx();
  if(state==='play'&&speed>300&&!lowQ){ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<8;i++){const y=(i*47+tm*30)%H,x=((i*131-tm*900)%W+W)%W;ctx.moveTo(x,y);ctx.lineTo(x+60,y)}ctx.stroke()}
  if(state==='splash')drawTitleCard();
  if(state==='play'||state==='pause')drawHud();
  if(state==='play'&&S.tut===4)drawTutRace();
  if(state==='play'&&slideTut)drawSlideHint();
  if(state==='pause')drawPause();
  if(state==='menu'){drawMenu();if(S.tut<4)drawSpot()}
  if(state==='over')drawOver();
  if(state==='cont')drawCont();
  if(state==='hi')drawHi();
  if(state==='terms')drawTerms();
  drawToast();
  ctx.restore();
}

function pos(e){return{x:(e.clientX*dpr-ox)/sc,y:(e.clientY*dpr-oy)/sc}}
cv.addEventListener('pointerdown',e=>{
  const p=pos(e);
  if(state==='splash'){if(splT>2.5){stopA();afterSplash()}return}
  ac();
  if(state==='play'){if(inR(p,W-52,6,44,40)){state='pause'}else{jump();held=true;swy=p.y}return}
  if(state==='menu'&&S.tut<4){const tr=tutRect();if(tr&&!inR(p,tr.x,tr.y,tr.w,tr.h))return}
  if((state==='over'||state==='cont'||state==='hi')&&performance.now()-overAt<500)return;
  for(const b of btns)if(inR(p,b.x,b.y,b.w,b.h)){sfx('click');vib(12);b.fn();return}
});
addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowUp')&&state==='play')jump()});
function bgOff(){if(state==='play')state='pause';held=false;if(AC&&AC.state==='running')AC.suspend()}
document.addEventListener('visibilitychange',()=>{document.hidden?bgOff():ac()});
addEventListener('blur',bgOff);addEventListener('pagehide',bgOff);addEventListener('focus',()=>{if(!document.hidden)ac()});
addEventListener('pointerup',()=>{held=false;swy=null});addEventListener('pointercancel',()=>{held=false;swy=null});
cv.addEventListener('pointermove',e=>{if(state==='play'&&swy!==null&&pos(e).y-swy>34){slide();swy=null;held=false}});

menuScene();state='splash';splT=0;
{const a=ac();if(a)a.resume().then(()=>{if(state==='splash'&&splT<.6&&S.sfx)intro()}).catch(()=>{})}
let last=performance.now(),sdt=1/60;
function loop(now){
  const raw=Math.min(.05,(now-last)/1000);last=now;sdt=sdt*.85+raw*.15;const dt=sdt;tm+=dt;fx.forEach(f=>{f.l-=dt;if(f.k===0){f.x+=f.vx*dt;f.y+=f.vy*dt}});fx=fx.filter(f=>f.l>0);
  if(state==='play'&&S.gfx===0&&!autoLow){fa+=raw;fcnt++;if(fa>3){if(fa/fcnt>.03){autoLow=true;applyGfx();say('Performance mode on')}fa=0;fcnt=0}}else{fa=0;fcnt=0}
  if(state==='play'){if(S.tut===4)tutRace(dt);update(dt*ts)}
  else if(state==='hi')hiT+=dt;
  else if(state==='menu'){bgx+=40*dt;P.ph+=dt*9;tutAdvance()}
  else if(state==='cont'){contT-=dt;if(contT<=0)finish(why,false)}
  else if(state==='splash'){splT+=dt;bgx+=60*dt;P.ph+=dt*9;if(splT>7)afterSplash()}
  const wm=state==='menu'?1:state==='play'?2:0;if(wm!==musOn){musOn=wm;music(wm)}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
