<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rooftop Courier</title>
<style>
html,body{margin:0;height:100%;background:#06050f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=640,H=360;
let sc=1,ox=0,oy=0,dpr=1;
function fit(){dpr=devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;sc=Math.min(cv.width/W,cv.height/H);ox=(cv.width-W*sc)/2;oy=(cv.height-H*sc)/2}
addEventListener('resize',fit);fit();

const Ads={onGameOver(n){/* AdMob goes here later */}};
const DIFF={easy:{n:'Easy',sp:230,g:[.25,.38],cr:.3,m:1,L:1400,rf:.95},normal:{n:'Normal',sp:280,g:[.32,.45],cr:.5,m:1.5,L:1900,rf:1.02},hard:{n:'Hard',sp:330,g:[.38,.52],cr:.7,m:2,L:2400,rf:1.07}};
const KEYS=['easy','normal','hard'];
let state='menu',dk='normal',df=DIFF.normal,best={easy:0,normal:0,hard:0};
try{Object.assign(best,JSON.parse(localStorage.getItem('rc_best')||'{}'))}catch(e){}
const PAL0={j:'#262c52',v:'#39e5ff',s:'#e0733a'};let PAL=PAL0,rv=[],fin=false,finAt=0,place=0,finCount=0,bonus=0;
let plats=[],cr=[],cn=[],genX=0,genY=0,nid=0,dist=0,coins=0,t=0,speed=0,bgx=0,tm=0,deaths=0,overAt=0,newBest=false,why='';
const P={x:90,y:300,vy:0,w:22,h:44,jumps:0,air:false,ph:0};

// sound (generated, no files)
let AC=null,muted=false;
function beep(a,b,d,ty,v){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=ty||'square';o.frequency.setValueAtTime(a,n);o.frequency.exponentialRampToValueAtTime(b,n+d);g.gain.setValueAtTime(v||.07,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}

function rnd(a,b){return a+Math.random()*(b-a)}
function hs(n){const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)}
function inR(p,x,y,w,h){return p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h}
function score(){return Math.floor((dist+coins*25)*df.m)+bonus}

function menuScene(){plats=[{x:-50,w:760,y:300,id:1}];cr=[];cn=[];rv=[];fin=false;P.y=300;P.vy=0;P.air=false;P.ph=0;state='menu'}
function reset(k){
  dk=k;df=DIFF[k];plats=[{x:-50,w:520,y:260,id:nid++}];cr=[];cn=[];
  genX=470;genY=260;P.y=260;P.vy=0;P.jumps=0;P.air=false;dist=0;coins=0;t=0;speed=df.sp;newBest=false;fin=false;finCount=0;place=0;bonus=0;rv=[{d:12,seed:1,sl:0,fin:false,pal:{j:'#6b2a35',v:'#ff4fa3',s:'#ffd23f'}},{d:24,seed:2,sl:0,fin:false,pal:{j:'#27533a',v:'#9cff57',s:'#39e5ff'}}];state='play';
}
function gen(){
  while(genX<W+300){
    const gap=speed*rnd(df.g[0],df.g[1]),d=[0,0,-40,-55,45,70];
    let ny=genY+d[Math.random()*d.length|0];ny=Math.max(200,Math.min(300,ny));
    const w=rnd(180,380),x=genX+gap;
    plats.push({x,w,y:ny,id:nid++});
    for(let i=0;i<3;i++)cn.push({x:genX+gap*(i+1)/4,y:Math.min(genY,ny)-68-(i===1?22:0)});
    if(w>240&&Math.random()<df.cr)cr.push({x:x+rnd(90,w-70),y:ny-28,w:28,h:28});
    genX=x+w;genY=ny;
  }
}
function jump(){
  if(P.jumps<2){P.vy=P.jumps===0?-640:-560;P.jumps++;P.air=true;beep(P.jumps===1?300:450,P.jumps===1?600:800,.12)}
}
function die(r,ok){
  state='over';why=r;overAt=performance.now();deaths++;ok?beep(600,1200,.4,'triangle',.1):beep(220,40,.4,'sawtooth',.12);
  const s=score();if(s>best[dk]){best[dk]=s;newBest=true;try{localStorage.setItem('rc_best',JSON.stringify(best))}catch(e){}}
  Ads.onGameOver(deaths);
}
function update(dt){
  t+=dt;speed=df.sp+Math.min(120,t*3);const dx=speed*dt;dist+=dx/10;bgx+=dx;genX-=dx;
  rv.forEach(r=>{
    if(r.fin)return;
    if(r.sl<=0&&Math.random()<dt*.12)r.sl=.9;
    if(r.sl>0)r.sl-=dt;
    const g=r.d-dist,f=df.rf+.05*Math.sin(t*.7+r.seed*3)+(g>40?-.05:g<-40?.05:0)-(r.sl>0?.5:0);
    r.d+=speed*f*dt/10;
    if(r.d>=df.L){r.d=df.L;r.fin=true;finCount++}
  });
  if(!fin&&dist>=df.L){fin=true;finAt=performance.now();place=finCount+1;beep(600,1200,.3,'triangle',.1)}
  if(fin&&performance.now()-finAt>1200){bonus=[500,250,100][place-1]*df.m;die(place===1?'You won!':place===2?'2nd place':'3rd place',true);return}
  plats.forEach(p=>p.x-=dx);cr.forEach(c=>c.x-=dx);cn.forEach(c=>c.x-=dx);
  const pf=P.y;P.vy+=2000*dt;P.y+=P.vy*dt;P.ph+=dt*speed/22;
  let land=false;
  for(const p of plats){
    if(p.x<P.x+P.w-4&&p.x+p.w>P.x+4){
      if(P.vy>=0&&pf<=p.y+6&&P.y>=p.y){P.y=p.y;P.vy=0;land=true}
      else if(P.vy>=0&&P.y>p.y&&P.y<=p.y+14){P.y=p.y;P.vy=0;land=true}
      else if(P.y>p.y+14&&!fin){die('You hit the wall');return}
    }
  }
  P.air=!land;if(land)P.jumps=0;
  if(P.y>H+60&&!fin){die('You fell');return}
  const b={x:P.x+4,y:P.y-P.h+4,w:P.w-8,h:P.h-8};
  for(const c of cr){if(!fin&&b.x<c.x+c.w&&b.x+b.w>c.x&&b.y<c.y+c.h&&b.y+b.h>c.y){die('You hit a crate');return}}
  const cx=P.x+P.w/2,cy=P.y-P.h/2;
  cn=cn.filter(c=>{if(Math.abs(c.x-cx)<20&&Math.abs(c.y-cy)<28){coins++;beep(880,1320,.1,'triangle');return false}return c.x>-20});
  plats=plats.filter(p=>p.x+p.w>-60);cr=cr.filter(c=>c.x>-40);
  gen();
}

function tx(s,x,y,size,col,al){ctx.font='700 '+size+'px system-ui,sans-serif';ctx.fillStyle=col;ctx.textAlign=al||'left';ctx.fillText(s,x,y)}
let sky=null;
function layer(f,cw,seed,minH,maxH,col,win){
  const off=bgx*f,k0=Math.floor(off/cw);
  for(let i=0;i<Math.ceil(W/cw)+2;i++){
    const k=k0+i,x=k*cw-off,h=minH+hs(k+seed)*(maxH-minH),y=H-h;
    ctx.fillStyle=col;ctx.fillRect(x,y,cw-6,h);
    if(win){
      ctx.fillStyle='#ffb347';
      for(let wy=y+10;wy<H-70;wy+=18)for(let wx=x+8;wx<x+cw-20;wx+=16)if(hs(k*31+wy*.7+wx*1.3+seed)>.74)ctx.fillRect(wx,wy,6,9);
      if(hs(k+7)>.8){ctx.fillStyle=k%2?'#39e5ff':'#ff4fa3';ctx.fillRect(x+10,y-12,cw-26,5)}
    }
  }
}
function drawBg(){
  if(!sky){sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0a0826');sky.addColorStop(.55,'#35185a');sky.addColorStop(1,'#c4553a')}
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for(let i=0;i<45;i++){ctx.globalAlpha=.3+.5*hs(i+3)*(.6+.4*Math.sin(tm*2+i));ctx.fillRect(hs(i+1)*W,hs(i+50)*150,2,2)}
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(243,230,200,.13)';ctx.beginPath();ctx.arc(550,72,64,0,7);ctx.fill();
  ctx.fillStyle='#f3e6c8';ctx.beginPath();ctx.arc(550,72,40,0,7);ctx.fill();
  ctx.fillStyle='#d9c9a4';[[538,60,8],[562,80,10],[546,86,5],[566,56,4]].forEach(c=>{ctx.beginPath();ctx.arc(c[0],c[1],c[2],0,7);ctx.fill()});
  layer(.08,60,1,70,170,'#241848',false);
  layer(.22,84,5,100,230,'#150f30',true);
}
function drawRain(){
  ctx.strokeStyle='rgba(180,200,255,.22)';ctx.lineWidth=1;ctx.beginPath();
  for(let i=0;i<36;i++){const x=((i*97-tm*140)%W+W)%W,y=(i*61+tm*520)%H;ctx.moveTo(x,y);ctx.lineTo(x-4,y+14)}
  ctx.stroke();
}
function drawPlat(p){
  ctx.fillStyle='#161a2e';ctx.fillRect(p.x,p.y,p.w,H-p.y);
  ctx.fillStyle='#3b4375';ctx.fillRect(p.x,p.y,p.w,4);
  ctx.fillStyle='#e0733a';ctx.fillRect(p.x,p.y+4,p.w,2);
  for(let r=0,wy=p.y+22;wy<H-8;wy+=26,r++)for(let c=0,wx=p.x+14;wx<p.x+p.w-20;wx+=28,c++){
    ctx.fillStyle=hs(p.id*17+r*5+c)>.62?'#ffb347':'#222849';ctx.fillRect(wx,wy,10,14);
  }
}
function drawCrate(c){
  ctx.fillStyle='#8a5a2b';ctx.fillRect(c.x,c.y,c.w,c.h);
  ctx.strokeStyle='#4a2f14';ctx.lineWidth=2;ctx.strokeRect(c.x+1,c.y+1,c.w-2,c.h-2);
  ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(c.x+c.w,c.y+c.h);ctx.moveTo(c.x+c.w,c.y);ctx.lineTo(c.x,c.y+c.h);ctx.stroke();
}
function drawCoin(c){
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(c.x,c.y,7,0,7);ctx.fill();
  ctx.fillStyle='#e0a800';ctx.beginPath();ctx.arc(c.x,c.y,3.5,0,7);ctx.fill();
}
function drawPlayer(){
  const x=P.x,f=P.y,ph=P.ph,lg=P.air?0:Math.sin(ph)*9,sw=Math.sin(ph*1.3)*5;
  ctx.lineCap='round';
  ctx.strokeStyle=PAL.s;ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(x+9,f-34);ctx.quadraticCurveTo(x-8,f-34+sw,x-26,f-28+(P.air?-6:Math.sin(ph)*7));ctx.stroke();
  ctx.strokeStyle='#0d1026';ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(x+9,f-14);ctx.lineTo(P.air?x+3:x+9-lg,P.air?f-4:f);ctx.stroke();
  ctx.strokeStyle='#1a1f3d';
  ctx.beginPath();ctx.moveTo(x+13,f-14);ctx.lineTo(P.air?x+19:x+13+lg,P.air?f-8:f);ctx.stroke();
  ctx.fillStyle='#7a4423';ctx.fillRect(x-1,f-34,8,15);
  ctx.fillStyle=PAL.j;ctx.fillRect(x+3,f-36,16,22);
  ctx.fillStyle=PAL.s;ctx.fillRect(x+3,f-26,16,3);
  ctx.strokeStyle='#323a6a';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(x+14,f-32);ctx.lineTo(P.air?x+24:x+18+lg*.6,P.air?f-40:f-22);ctx.stroke();
  ctx.fillStyle=PAL.j;ctx.beginPath();ctx.arc(x+13,f-41,7,0,7);ctx.fill();
  ctx.globalAlpha=.28;ctx.fillStyle=PAL.v;ctx.fillRect(x+12,f-46,11,7);ctx.globalAlpha=1;
  ctx.fillStyle=PAL.v;ctx.fillRect(x+14,f-44,8,3);
}
function rivalPos(x){
  let a=null,b=null;
  for(const p of plats){
    if(x>=p.x&&x<=p.x+p.w)return{y:p.y,air:false};
    if(p.x+p.w<x)a=p;else if(!b)b=p;
  }
  if(a&&b){const e=a.x+a.w,f=(x-e)/(b.x-e);return{y:a.y+(b.y-a.y)*f-4*f*(1-f)*70,air:true}}
  return null;
}
function drawRival(r,i){
  const rx=P.x+(r.d-dist)*10,cx=rx+11,y0=100+i*26;
  if(cx>W-6||cx<6){
    const L=cx<6,tip=L?4:W-4,bs=L?14:W-14;
    ctx.fillStyle=r.pal.v;ctx.beginPath();ctx.moveTo(tip,y0);ctx.lineTo(bs,y0-6);ctx.lineTo(bs,y0+6);ctx.fill();
    tx(Math.round(Math.abs(r.d-dist))+'m',L?20:W-20,y0+4,12,r.pal.v,L?'left':'right');return;
  }
  const g=rivalPos(cx);if(!g)return;
  let y=g.y,air=g.air;
  for(const c of cr){const m=cx-(c.x-24);if(m>0&&m<c.w+48){const f=m/(c.w+48);y-=4*f*(1-f)*58;air=true}}
  const s={x:P.x,y:P.y,ph:P.ph,air:P.air};
  P.x=rx;P.y=y;P.ph=r.d*.46+r.seed;P.air=air||r.sl>0;PAL=r.pal;drawPlayer();PAL=PAL0;Object.assign(P,s);
}
function drawFinish(){
  const fx=P.x+(df.L-dist)*10;
  if(state==='menu'||fx<-20||fx>W+20)return;
  for(let r=0;r<30;r++)for(let c=0;c<2;c++){ctx.fillStyle=(r+c)%2?'#fff':'#111';ctx.fillRect(fx+c*8,r*12,8,12)}
}
function drawRace(){
  const x0=200,w=240,y=18;
  ctx.fillStyle='rgba(230,238,242,.25)';ctx.fillRect(x0,y-1,w,3);
  rv.forEach(r=>{ctx.fillStyle=r.pal.v;ctx.beginPath();ctx.arc(x0+w*Math.min(1,r.d/df.L),y,4,0,7);ctx.fill()});
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x0+w*Math.min(1,dist/df.L),y,5,0,7);ctx.fill();
  tx(['1st','2nd','3rd'][rv.filter(r=>r.d>dist).length]+' of 3',W/2,44,16,'#e6eef2','center');
  if(fin)tx('Finish!',W/2,130,48,'#ffd23f','center');
}
function btn(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#06050f';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(sc,0,0,sc,ox,oy);ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  drawBg();plats.forEach(drawPlat);cr.forEach(drawCrate);cn.forEach(drawCoin);rv.forEach(drawRival);drawFinish();drawPlayer();drawRain();
  if(state==='play'||state==='pause'){
    tx(String(score()),16,34,26,'#e6eef2');
    ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(24,52,6,0,7);ctx.fill();tx(String(coins),36,57,15,'#e6eef2');
    drawRace();
    ctx.fillStyle='#e6eef2';ctx.fillRect(W-40,14,6,20);ctx.fillRect(W-28,14,6,20);
  }
  if(state==='pause'){ctx.fillStyle='rgba(6,5,15,.7)';ctx.fillRect(0,0,W,H);tx('Paused',W/2,170,36,'#e6eef2','center');tx('Tap to resume',W/2,205,16,'#9fb6c2','center')}
  if(state==='menu'){
    tx('Rooftop Courier',W/2,70,44,'#e6eef2','center');
    tx('Beat two rivals across the rooftops',W/2,98,16,'#c9b7e8','center');
    KEYS.forEach((k,i)=>{
      const x=60+i*180;btn(x,140,160,70,i===0?'#2a9d8f':i===1?'#e0733a':'#c8372d');
      tx(DIFF[k].n,x+80,172,24,'#0d1026','center');tx('Best '+best[k],x+80,196,14,'#0d1026','center');
    });
    btn(W-120,H-46,100,32,'rgba(6,5,15,.75)');tx(muted?'Sound off':'Sound on',W-70,H-25,15,'#e6eef2','center');
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,5,15,.8)';ctx.fillRect(0,0,W,H);
    tx(why,W/2,80,28,'#ff6b5e','center');
    tx(String(score()),W/2,150,58,'#e6eef2','center');
    tx(newBest?'New best':'Best '+best[dk],W/2,182,18,newBest?'#ffd23f':'#9fb6c2','center');
    tx(df.n+'  |  Coins '+coins,W/2,208,15,'#9fb6c2','center');
    btn(150,235,160,48,'#e0733a');tx('Run again',230,266,20,'#0d1026','center');
    btn(330,235,160,48,'#3b4375');tx('Menu',410,266,20,'#e6eef2','center');
  }
  ctx.restore();
}

function pos(e){return{x:(e.clientX*dpr-ox)/sc,y:(e.clientY*dpr-oy)/sc}}
cv.addEventListener('pointerdown',e=>{
  const p=pos(e);
  if(state==='menu'){
    if(inR(p,W-120,H-46,100,32)){muted=!muted;beep(600,900,.1);return}
    KEYS.forEach((k,i)=>{if(inR(p,60+i*180,140,160,70)){reset(k);beep(500,900,.1)}});
  }else if(state==='play'){
    if(inR(p,W-60,4,52,44))state='pause';else jump();
  }else if(state==='pause')state='play';
  else if(state==='over'&&performance.now()-overAt>500){
    if(inR(p,150,235,160,48))reset(dk);else if(inR(p,330,235,160,48))menuScene();
  }
});
addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowUp')&&state==='play')jump()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')state='pause'});

menuScene();
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;tm+=dt;
  if(state==='play')update(dt);else if(state==='menu'){bgx+=40*dt;P.ph+=dt*9}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
