<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bandit Dash</title>
<style>
html,body{margin:0;height:100%;background:#06050f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const H=360,P={x:96,y:300,vy:0,w:22,h:44,jumps:0,air:false,ph:0,so:0};
let W=640,sc=1,ox=0,oy=0,dpr=1;
function fit(){dpr=Math.min(devicePixelRatio||1,1280/innerWidth);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;W=Math.max(560,Math.min(900,cv.width/(cv.height/H)));sc=Math.min(cv.width/W,cv.height/H);ox=(cv.width-W*sc)/2;oy=(cv.height-H*sc)/2;P.x=Math.round(W*.15)}
addEventListener('resize',fit);fit();

const STUDIO='MustyTheCreator';
const Ads={onGameOver(n){/* AdMob later */}};
const SK=[{f:'#9aa1b5',j:'#262c52',s:'#e0733a',c:0,a:0},{f:'#c4ae92',j:'#6b2a35',s:'#ffd23f',c:100,a:1},{f:'#a8c4b8',j:'#1f4f46',s:'#9cff57',c:250,a:2},{f:'#b7a6d8',j:'#3a2a6b',s:'#ff4fa3',c:400,a:3},{f:'#e6cf8a',j:'#4a3a12',s:'#39e5ff',c:700,a:4},{f:'#6b7190',j:'#0d1026',s:'#ff4f4f',c:1000,a:5}];
const DIFF={w0:{n:'Midnight Rooftops',sp:250,rf:1.02,m:1.5,L:3600,g:[.26,.38],cr:.3}};
function def(){return{coins:0,best:{w0:0},stars:{w0:0},runs:0,own:[0],skin:0,up:{s:0,m:0,b:0,g:0},sfx:1,mus:1,vib:1}}
let S=def();
try{Object.assign(S,JSON.parse(localStorage.getItem('bd2')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('bd2',JSON.stringify(S))}catch(e){}}

let state='splash',scr='main',dk='w0',df=DIFF.w0,plats=[],cr=[],cn=[],pu=[],rv=[],genX=0,genY=0,nid=0,dist=0,coins=0,t=0,speed=0,bgx=0,tm=0,deaths=0,overAt=0,newBest=false,why='',earn=0,fin=false,finAt=0,place=0,finCount=0,bonus=0,splT=0,pw={s:0,m:0,b:0,g:0},inv=0,conf=false,musOn=0,toast='',toastU=0,held=false,btns=[],PAL=SK[0];
function rnd(a,b){return a+Math.random()*(b-a)}
function hs(n){const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)}
function inR(p,x,y,w,h){return p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h}
function score(){return Math.floor((dist+coins*25)*df.m)+bonus}

// ---------- sound (soft synth, no files) ----------
let AC=null,mst=null,nb=null,mt=null,ms=0,song=0;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();mst=AC.createDynamicsCompressor();mst.connect(AC.destination)}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function stopA(){if(AC){try{AC.close()}catch(e){}AC=null;mst=null;nb=null}}
function vib(p){if(S.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
function say(m){toast=m;toastU=tm+2.2}
function note(f,d,ty,v,at,f2,lf){
  const a=ac();if(!a)return;
  const n=a.currentTime+(at||0),o=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter();
  lp.type='lowpass';lp.frequency.value=lf||2400;o.type=ty||'sine';
  o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v||.2,n+.012);g.gain.exponentialRampToValueAtTime(.0001,n+d);
  o.connect(lp);lp.connect(g);g.connect(mst);o.start(n);o.stop(n+d+.03);
}
function nz(d,v,hp,at){
  const a=ac();if(!a)return;
  if(!nb){nb=a.createBuffer(1,a.sampleRate*.3,a.sampleRate);const x=nb.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1}
  const n=a.currentTime+(at||0),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=nb;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);
  s.connect(f);f.connect(g);g.connect(mst);s.start(n);s.stop(n+d);
}
function sfx(k){
  if(!S.sfx)return;
  if(k==='click')note(660,.08,'sine',.2,0,500);
  else if(k==='jump')note(330,.16,'triangle',.22,0,580);
  else if(k==='jump2')note(440,.16,'triangle',.22,0,760);
  else if(k==='coin'){note(988,.1,'sine',.18);note(1319,.18,'sine',.18,.07)}
  else if(k==='pow')[523,659,784,1047].forEach((f,i)=>note(f,.22,'triangle',.18,i*.07));
  else if(k==='crash'){note(150,.45,'sawtooth',.22,0,45,900);nz(.25,.25,300)}
  else if(k==='win')[523,659,784,1047,1319].forEach((f,i)=>note(f,.4,'triangle',.18,i*.1));
  else if(k==='no')note(220,.18,'triangle',.18,0,150);
}
function intro(){[392,523,659].forEach((f,i)=>note(f,1,'sine',.18,.3+i*.18));note(1319,.7,'sine',.12,1.2);note(180,.7,'sine',.14,2.4,900);note(90,.5,'sine',.3,3.1,50)}
const RT=[110,87.3,130.8,98],AR=[[220,262,330,262],[175,220,262,220],[262,330,392,330],[196,247,294,247]];
function music(m){
  clearInterval(mt);mt=null;song=m;if(!m)return;ms=0;
  mt=setInterval(()=>{
    if(!S.mus||!AC||AC.state!=='running')return;
    const c=(ms>>3)&3,i=ms&7;
    if(song===1){
      note(AR[c][ms&3]*(i>3?2:1),.3,'triangle',.1);
      if(i===0){note(RT[c],2,'sine',.2);note(RT[c]*2,2,'sine',.06)}
    }else{
      if(i===0||i===4)note(150,.16,'sine',.45,0,42);
      if(i===2||i===6)nz(.12,.18,1500);
      if(i&1)nz(.04,.1,7000);
      if(i===0||i===3||i===4||i===7)note(RT[c],.22,'triangle',.3,0,0,700);
      note(AR[c][ms&3]*2,.18,'square',.07,0,0,3000);
    }
    ms++;
  },song===1?300:210);
}

// ---------- world ----------
function menuScene(){plats=[{x:-60,w:W+200,y:300,id:1}];cr=[];cn=[];pu=[];rv=[];fin=false;pw.s=pw.m=pw.b=pw.g=0;P.y=300;P.vy=0;P.air=false;P.so=0;state='menu';scr='main';conf=false}
function reset(){
  df=Object.assign({},DIFF.w0);const w0=Math.round(W*.8);plats=[{x:-60,w:w0,y:260,id:nid++}];cr=[];cn=[];pu=[];
  genX=w0-60;genY=260;P.y=260;P.vy=0;P.jumps=0;P.air=false;P.so=0;dist=0;coins=0;t=0;speed=df.sp;
  newBest=false;fin=false;finCount=0;place=0;bonus=0;pw.s=pw.m=pw.b=pw.g=0;inv=0;
  const o=SK.map((_,i)=>i).filter(i=>i!==S.skin).sort(()=>Math.random()-.5);
  rv=[{d:12,seed:1,sl:0,fin:false,pal:SK[o[0]]},{d:24,seed:2,sl:0,fin:false,pal:SK[o[1]]}];
  state='play';
}
function gen(){
  while(genX<W+300){
    const gap=speed*rnd(df.g[0],df.g[1]),d=[0,0,-40,-55,45,70];
    let ny=genY+d[Math.random()*d.length|0];ny=Math.max(200,Math.min(300,ny));
    const w=rnd(180,380),x=genX+gap;
    plats.push({x,w,y:ny,id:nid++});
    for(let i=0;i<3;i++)cn.push({x:genX+gap*(i+1)/4,y:Math.min(genY,ny)-68-(i===1?22:0)});
    if(w>240&&Math.random()<df.cr)cr.push({x:x+rnd(90,w-70),y:ny-28,w:28,h:28});
    if(Math.random()<.2)pu.push({x:x+rnd(50,w-50),y:ny-62,k:'smbg'[Math.random()*4|0]});
    genX=x+w;genY=ny;
  }
}
function jump(){if(P.jumps<2){P.vy=(P.jumps===0?-640:-560)*(pw.b>0?1.22:1);P.jumps++;P.air=true;sfx(P.jumps===1?'jump':'jump2')}}
function die(r,ok){
  state='over';why=r;overAt=performance.now();deaths++;
  sfx(ok?'win':'crash');vib(ok?[40,50,40,50,80]:120);S.runs++;
  const s=score();newBest=s>S.best[dk];if(newBest)S.best[dk]=s;
  earn=coins+(ok?[30,15,5][place-1]:0);S.coins+=earn;
  if(ok)S.stars[dk]=Math.max(S.stars[dk],4-place);
  save();Ads.onGameOver(deaths);
}
function update(dt){
  t+=dt;{const z=Math.min(1,dist/df.L);df.g=[.26+.2*z,.38+.17*z];df.cr=.3+.45*z}speed=df.sp+Math.min(190,t*3.5);const dx=speed*dt;dist+=dx/10;bgx+=dx;genX-=dx;
  for(const k of 'smbg')if(pw[k]>0)pw[k]-=dt;if(inv>0)inv-=dt;
  rv.forEach(r=>{
    if(r.fin)return;
    if(r.sl<=0&&Math.random()<dt*.12)r.sl=.9;
    if(r.sl>0)r.sl-=dt;
    const g=r.d-dist,f=df.rf+.05*Math.sin(t*.7+r.seed*3)+(g>40?-.05:g<-40?.05:0)-(r.sl>0?.5:0);
    r.d+=speed*f*dt/10;
    if(r.d>=df.L){r.d=df.L;r.fin=true;finCount++}
  });
  if(!fin&&dist>=df.L){fin=true;finAt=performance.now();place=finCount+1;sfx('win')}
  if(fin&&performance.now()-finAt>1200){bonus=[500,250,100][place-1]*df.m;die(place===1?'You won!':place===2?'2nd place':'3rd place',true);return}
  plats.forEach(p=>p.x-=dx);cr.forEach(c=>c.x-=dx);cn.forEach(c=>c.x-=dx);pu.forEach(u=>u.x-=dx);
  const pf=P.y;P.vy+=2000*dt;if(pw.g>0&&held&&P.air&&P.vy>70)P.vy=70;P.y+=P.vy*dt;P.ph+=dt*speed/22;P.so*=Math.exp(-14*dt);
  let land=false;
  for(const p of plats){
    if(p.x<P.x+P.w-4&&p.x+p.w>P.x+4){
      if(P.vy>=0&&pf<=p.y+6&&P.y>=p.y){P.y=p.y;P.vy=0;land=true}
      else if(P.vy>=0&&P.y>p.y&&P.y<=p.y+14){P.so+=P.y-p.y;P.y=p.y;P.vy=0;land=true}
      else if(P.y>p.y+14&&!fin){die('You hit the wall');return}
    }
  }
  P.air=!land;if(land)P.jumps=0;
  if(P.y>H+60&&!fin){die('You fell');return}
  const b={x:P.x+4,y:P.y-P.h+4,w:P.w-8,h:P.h-8},cx=P.x+P.w/2,cy=P.y-P.h/2;
  if(!fin&&inv<=0){
    const hc=cr.find(c=>b.x<c.x+c.w&&b.x+b.w>c.x&&b.y<c.y+c.h&&b.y+b.h>c.y);
    if(hc){if(pw.s>0){pw.s=0;inv=1.2;cr.splice(cr.indexOf(hc),1);sfx('no');vib(50)}else{die('You hit a crate');return}}
  }
  if(pw.m>0)cn.forEach(c=>{const a=cx-c.x,e=cy-c.y,d=Math.hypot(a,e);if(d<170&&d>1){c.x+=a/d*520*dt;c.y+=e/d*520*dt}});
  cn=cn.filter(c=>{if(Math.abs(c.x-cx)<20&&Math.abs(c.y-cy)<28){coins++;sfx('coin');return false}return c.x>-20});
  pu=pu.filter(u=>{if(Math.abs(u.x-cx)<22&&Math.abs(u.y-cy)<30){pw[u.k]=({s:6,m:6,b:8,g:8})[u.k]+({s:3,m:2,b:3,g:3})[u.k]*S.up[u.k];sfx('pow');vib(20);return false}return u.x>-30});
  plats=plats.filter(p=>p.x+p.w>-60);cr=cr.filter(c=>c.x>-40);
  gen();
}

// ---------- drawing ----------
function tx(s,x,y,size,col,al){ctx.font='700 '+size+'px system-ui,sans-serif';ctx.fillStyle=col;ctx.textAlign=al||'left';ctx.fillText(s,x,y)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function btn(x,y,w,h,col){ctx.fillStyle='rgba(0,0,0,.35)';rr(x,y+4,w,h,12);ctx.fill();ctx.fillStyle=col;rr(x,y,w,h,12);ctx.fill();ctx.fillStyle='rgba(255,255,255,.18)';rr(x+4,y+3,w-8,h*.35,8);ctx.fill()}
function B(x,y,w,h,label,col,fn,sub){
  btn(x,y,w,h,col);const z=h>80?28:h>56?26:20;
  tx(label,x+w/2,y+h/2+(sub?-6:z/3),z,'#0d1026','center');
  if(sub)tx(sub,x+w/2,y+h-16,14,'#0d1026','center');
  btns.push({x,y,w,h,fn});
}
let sky=null;
function layer(f,cw,seed,minH,maxH,col,win){
  const off=bgx*f,k0=Math.floor(off/cw);
  for(let i=0;i<Math.ceil(W/cw)+2;i++){
    const k=k0+i,x=Math.round(k*cw-off),h=Math.round(minH+hs(k+seed)*(maxH-minH)),y=H-h;
    ctx.fillStyle=col;ctx.fillRect(x,y,cw-6,h);
    ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(x,y,cw-6,2);
    if(win){
      ctx.fillStyle='#ffb347';
      for(let wy=y+10;wy<H-70;wy+=18)for(let wx=x+8;wx<x+cw-20;wx+=16)if(hs(k*31+wy*.7+wx*1.3+seed)>.74)ctx.fillRect(wx,wy,6,9);
      if(hs(k+7)>.8){ctx.fillStyle=k%2?'#39e5ff':'#ff4fa3';ctx.fillRect(x+10,y-12,cw-26,5)}
      if(hs(k+11)>.7&&Math.sin(tm*3+k)>0){ctx.fillStyle='#ff4f4f';ctx.fillRect(x+Math.round(cw/2)-5,y-6,3,3)}
    }
  }
}
function drawBg(){
  if(!sky){sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0a0826');sky.addColorStop(.55,'#35185a');sky.addColorStop(1,'#c4553a')}
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for(let i=0;i<45;i++){ctx.globalAlpha=.3+.5*hs(i+3)*(.6+.4*Math.sin(tm*2+i));ctx.fillRect(hs(i+1)*W,hs(i+50)*150,2,2)}
  ctx.globalAlpha=1;
  const mx=W-90;
  ctx.fillStyle='rgba(243,230,200,.13)';ctx.beginPath();ctx.arc(mx,72,64,0,7);ctx.fill();
  ctx.fillStyle='#f3e6c8';ctx.beginPath();ctx.arc(mx,72,40,0,7);ctx.fill();
  ctx.fillStyle='#d9c9a4';[[-12,-12,8],[12,8,10],[-4,14,5],[16,-16,4]].forEach(c=>{ctx.beginPath();ctx.arc(mx+c[0],72+c[1],c[2],0,7);ctx.fill()});
  layer(.08,60,1,70,170,'#241848',false);
  layer(.22,84,5,100,230,'#150f30',true);
}
function drawRain(){
  ctx.strokeStyle='rgba(180,200,255,.22)';ctx.lineWidth=1;ctx.beginPath();
  for(let i=0;i<36;i++){const x=((i*97-tm*140)%W+W)%W,y=(i*61+tm*520)%H;ctx.moveTo(x,y);ctx.lineTo(x-4,y+14)}
  ctx.stroke();
}
function drawPlat(p){
  const X=Math.round(p.x),Wd=Math.round(p.w),y=p.y,n=hs(p.id*3.7);
  ctx.fillStyle='#161a2e';ctx.fillRect(X,y,Wd,H-y);
  ctx.fillStyle='#3b4375';ctx.fillRect(X,y,Wd,4);
  ctx.fillStyle='#e0733a';ctx.fillRect(X,y+4,Wd,2);
  ctx.fillStyle='#0b0d1c';
  if(n>.3){const ax=X+30+Math.round(hs(p.id)*(Wd-80));ctx.fillRect(ax,y-46,3,46);ctx.fillRect(ax-8,y-38,19,2);ctx.fillRect(ax-5,y-28,13,2);ctx.fillStyle='#ff4f4f';ctx.fillRect(ax-1,y-50,5,4);ctx.fillStyle='#0b0d1c'}
  if(n<.6){const t0=X+40+Math.round(hs(p.id+9)*(Wd-120));ctx.fillRect(t0,y-30,28,22);ctx.fillRect(t0-1,y-34,30,5);ctx.fillRect(t0+2,y-8,3,8);ctx.fillRect(t0+23,y-8,3,8)}
  for(let r=0,wy=y+22;wy<H-8;wy+=26,r++)for(let c=0,wx=X+14;wx<X+Wd-20;wx+=28,c++){
    ctx.fillStyle=hs(p.id*17+r*5+c)>.62?'#ffb347':'#222849';ctx.fillRect(wx,wy,10,14);
  }
}
function drawCrate(c){
  const X=Math.round(c.x);
  ctx.fillStyle='#8a5a2b';ctx.fillRect(X,c.y,c.w,c.h);
  ctx.strokeStyle='#4a2f14';ctx.lineWidth=2;ctx.strokeRect(X+1,c.y+1,c.w-2,c.h-2);
  ctx.beginPath();ctx.moveTo(X,c.y);ctx.lineTo(X+c.w,c.y+c.h);ctx.moveTo(X+c.w,c.y);ctx.lineTo(X,c.y+c.h);ctx.stroke();
}
function drawCoin(c){
  const X=Math.round(c.x),w=Math.abs(Math.cos(tm*4))*6+1.5;
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.ellipse(X,c.y,w,7,0,0,7);ctx.fill();
  ctx.fillStyle='#e0a800';ctx.beginPath();ctx.ellipse(X,c.y,w*.5,3.5,0,0,7);ctx.fill();
}
function icon(k,x,y,z){
  ctx.save();ctx.translate(x,y);ctx.scale(z||1,z||1);ctx.fillStyle='#0d1026';ctx.strokeStyle='#0d1026';
  if(k==='s'){ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(8,-5);ctx.lineTo(6,4);ctx.quadraticCurveTo(3,8,0,10);ctx.quadraticCurveTo(-3,8,-6,4);ctx.lineTo(-8,-5);ctx.closePath();ctx.fill()}
  else if(k==='m'){ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,6,Math.PI,0);ctx.stroke();ctx.fillRect(-8,0,4,8);ctx.fillRect(4,0,4,8)}
  else if(k==='b'){ctx.beginPath();ctx.moveTo(-5,-9);ctx.lineTo(2,-9);ctx.lineTo(2,1);ctx.lineTo(9,5);ctx.lineTo(9,9);ctx.lineTo(-5,9);ctx.closePath();ctx.fill()}
  else{ctx.beginPath();ctx.moveTo(-10,3);ctx.lineTo(10,-6);ctx.lineTo(3,8);ctx.closePath();ctx.fill()}
  ctx.restore();
}
function drawPu(u){
  const X=Math.round(u.x),c={s:'#39e5ff',m:'#ff4fa3',b:'#9cff57',g:'#ffd23f'}[u.k],b=Math.sin(tm*4+u.x*.05)*3;
  ctx.fillStyle=c;ctx.globalAlpha=.25;ctx.beginPath();ctx.arc(X,u.y+b,17,0,7);ctx.fill();
  ctx.globalAlpha=1;ctx.beginPath();ctx.arc(X,u.y+b,11,0,7);ctx.fill();icon(u.k,X,u.y+b,.9);
}
function drawPlayer(){
  const x=P.x,f=P.y,ph=P.ph,air=P.air,lg=air?0:Math.sin(ph)*9,sw=Math.sin(ph*1.3)*5;
  ctx.lineCap='round';
  for(let i=0;i<5;i++){const u=i/4,qx=x+2-26*u,qy=f-20-8*u+Math.sin(ph*1.3+u*3)*5*u;ctx.fillStyle=i%2?'#2a2d40':PAL.f;ctx.beginPath();ctx.arc(qx,qy,6-u*2,0,7);ctx.fill()}
  ctx.strokeStyle='#0d1026';ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(x+9,f-14);ctx.lineTo(air?x+3:x+9-lg,air?f-4:f);ctx.stroke();
  ctx.strokeStyle='#1a1f3d';
  ctx.beginPath();ctx.moveTo(x+13,f-14);ctx.lineTo(air?x+19:x+13+lg,air?f-8:f);ctx.stroke();
  ctx.fillStyle=PAL.j;ctx.fillRect(x+3,f-34,16,21);
  ctx.fillStyle=PAL.s;ctx.fillRect(x+3,f-24,16,3);
  ctx.strokeStyle=PAL.s;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+8,f-32);ctx.quadraticCurveTo(x-6,f-32+sw,x-16,f-28+(air?-5:Math.sin(ph)*5));ctx.stroke();
  ctx.strokeStyle=PAL.j;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x+14,f-30);ctx.lineTo(air?x+24:x+18+lg*.6,air?f-38:f-20);ctx.stroke();
  ctx.fillStyle=PAL.f;ctx.beginPath();ctx.arc(x+14,f-38,8,0,7);ctx.fill();

function rivalPos(x){

    if(p.x+p.w<x)a=p;else if(!b)b=p;
  }
  if(a&&b){const e=a.x+a.w,f=(x-e)/(b.x-e);return{y:a.y+(b.y-a.y)*f-4*f*(1-f)*70,air:true}}
  return null;
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#06050f';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(sc,0,0,sc,ox,oy);ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();

  drawBg();plats.forEach(drawPlat);cr.forEach(drawCrate);cn.forEach(drawCoin);pu.forEach(drawPu);rv.forEach(drawRival);drawFinish();

function pos(e){return{x:(e.clientX*dpr-ox)/sc,y:(e.clientY*dpr-oy)/sc}}
cv.addEventListener('pointerdown',e=>{
  const p=pos(e);
  if(state==='splash'){if(splT>.6){stopA();menuScene()}return}
  ac();
  if(state==='play'){if(inR(p,W-52,6,44,40)){state='pause'}else{jump();held=true}return}
  if(state==='over'&&performance.now()-overAt<500)return;
  for(const b of btns)if(inR(p,b.x,b.y,b.w,b.h)){sfx('click');vib(12);b.fn();return}
});
addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowUp')&&state==='play')jump()});
function bgOff(){if(state==='play')state='pause';held=false;if(AC&&AC.state==='running')AC.suspend()}
document.addEventListener('visibilitychange',()=>{document.hidden?bgOff():ac()});
addEventListener('blur',bgOff);addEventListener('pagehide',bgOff);addEventListener('focus',()=>{if(!document.hidden)ac()});
addEventListener('pointerup',()=>{held=false});addEventListener('pointercancel',()=>{held=false});

menuScene();state='splash';splT=0;
{const a=ac();if(a)a.resume().then(()=>{if(state==='splash'&&splT<.6&&S.sfx)intro()}).catch(()=>{})}
let last=performance.now(),sdt=1/60;
function loop(now){
  const raw=Math.min(.05,(now-last)/1000);last=now;sdt=sdt*.85+raw*.15;const dt=sdt;tm+=dt;
  if(state==='play')update(dt);
  else if(state==='menu'){bgx+=40*dt;P.ph+=dt*9}
  else if(state==='splash'){splT+=dt;bgx+=60*dt;P.ph+=dt*9;if(splT>4.8)menuScene()}
  const wm=state==='menu'?1:state==='play'?2:0;if(wm!==musOn){musOn=wm;music(wm)}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
