name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Fullscreen and landscape
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          F=$(find android/app/src/main/java -name MainActivity.java)
          cat > "$F" <<'EOF'
          package com.mustythecreator.banditdash;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = getWindow().getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(lp);
              }
              hide();
            }
            @Override
            public void onWindowFocusChanged(boolean f) {
              super.onWindowFocusChanged(f);
              if (f) hide();
            }
            private void hide() {
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN
                | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
            }
          }
          EOF
      - name: Vibrate permission
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.VIBRATE" />' android/app/src/main/AndroidManifest.xml
      - name: Notification permission
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml
      - name: Icons and splash
        run: |
          pip install pillow
          python3 - <<'PY'
          import os,glob
          from PIL import Image
          R='android/app/src/main/res'
          fg=Image.open('icon-fg.png').convert('RGBA')
          ic=Image.open('icon.png').convert('RGBA')
          nt=Image.open('notif.png').convert('RGBA')
          for d,a,b,c in [('mdpi',108,48,24),('hdpi',162,72,36),('xhdpi',216,96,48),('xxhdpi',324,144,72),('xxxhdpi',432,192,96)]:
              os.makedirs(R+'/mipmap-'+d,exist_ok=True)
              os.makedirs(R+'/drawable-'+d,exist_ok=True)
              fg.resize((a,a),Image.LANCZOS).save(R+'/mipmap-'+d+'/ic_launcher_foreground.png')
              ic.resize((b,b),Image.LANCZOS).save(R+'/mipmap-'+d+'/ic_launcher.png')
              ic.resize((b,b),Image.LANCZOS).save(R+'/mipmap-'+d+'/ic_launcher_round.png')
              nt.resize((c,c),Image.LANCZOS).save(R+'/drawable-'+d+'/ic_stat_bandit.png')
          for p in glob.glob(R+'/values/ic_launcher_background.xml'):
              open(p,'w').write('<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#14102E</color></resources>')
          for f in glob.glob(R+'/**/splash.png',recursive=True):
              w,h=Image.open(f).size
              bg=Image.new('RGBA',(w,h),(20,16,46,255))
              s=min(w,h)//3
              bg.alpha_composite(ic.resize((s,s)),((w-s)//2,(h-s)//2))
              bg.convert('RGB').save(f)
          print('ICON FILES WRITTEN:',len(glob.glob(R+'/mipmap-*/ic_launcher*.png')))
          PY
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bandit-dash-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
