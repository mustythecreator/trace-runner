name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Fullscreen and landscape
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          F=$(find android/app/src/main/java -name MainActivity.java)
          cat > "$F" <<'EOF'
          package com.mustythecreator.banditdash;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = getWindow().getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(lp);
              }
              hide();
            }
            @Override
            public void onWindowFocusChanged(boolean f) {
              super.onWindowFocusChanged(f);
              if (f) hide();
            }
            private void hide() {
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN
                | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
            }
          }
          EOF
      - name: Vibrate permission
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.VIBRATE" />' android/app/src/main/AndroidManifest.xml
      - name: Notification permission
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml
      - name: Icons and splash
        continue-on-error: true
        run: |
          R=android/app/src/main/res
          for d in "mdpi 108 48 24" "hdpi 162 72 36" "xhdpi 216 96 48" "xxhdpi 324 144 72" "xxxhdpi 432 192 96"; do
            set -- $d
            mkdir -p $R/mipmap-$1 $R/drawable-$1
            convert icon-fg.png -resize $2x$2 $R/mipmap-$1/ic_launcher_foreground.png
            convert icon.png -resize $3x$3 $R/mipmap-$1/ic_launcher.png
            convert icon.png -resize $3x$3 $R/mipmap-$1/ic_launcher_round.png
            convert notif.png -resize $4x$4 $R/drawable-$1/ic_stat_bandit.png
          done
          sed -E -i 's/#[0-9A-Fa-f]{6}/#14102E/' $R/values/ic_launcher_background.xml
          for f in $(find $R -name splash.png); do
            g=$(identify -format %wx%h $f)
            convert -size $g xc:'#14102E' \( icon.png -resize 360x360 \) -gravity center -composite $f
          done
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bandit-dash-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
